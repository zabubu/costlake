name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.17.2"
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: make install
      - name: ruff format --check
        run: .venv/bin/ruff format --check --diff src tests
      - name: ruff check
        run: .venv/bin/ruff check --output-format=github src tests
      - name: mypy
        run: .venv/bin/mypy src

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17.12-alpine3.23
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      COSTLAKE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: make install
      - name: Unit tests
        run: make test
      - name: dbt parse (manifest for the Dagster definitions test)
        run: make dbt-parse
      - name: Integration tests (pipeline + dbt + PostgreSQL + Dagster definitions)
        run: make test-integration
      - name: Test summary
        if: always()
        run: python scripts/junit_summary.py reports/*.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            reports/
            coverage.xml
          retention-days: 14

  terraform:
    name: terraform (fmt, validate, test, tflint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: fmt, validate and terraform test (mocked providers, no credentials)
        run: make tf-check
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: security (dependencies, secrets, IaC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: |
          python -m pip install --quiet pip-audit==2.10.0
          pip-audit --strict --disable-pip --no-deps -r requirements/runtime.lock
      - name: gitleaks (secrets in git history)
        run: >
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
      # envs/local targets SeaweedFS, which implements none of the AWS-only controls
      # (public access block, SSE, bucket policies); envs/aws and the modules are scanned.
      - name: trivy config (Dockerfile, docker-compose, Terraform)
        run: >
          docker run --rm -v "$PWD":/src "$TRIVY_IMAGE" config
          --exit-code 1 --severity HIGH,CRITICAL
          --skip-dirs /src/.github --skip-dirs /src/infrastructure/terraform/envs/local /src

  docker:
    name: docker (hadolint, build, scan, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: costlake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (CLI, config, Dagster definitions load)
        run: |
          docker run --rm costlake:ci costlake validate-config
          docker run --rm costlake:ci python -c "from costlake.orchestration.definitions import defs; print(len(list(defs.get_repository_def().asset_graph.get_all_asset_keys())), 'assets')"
      - name: trivy image (fixable HIGH/CRITICAL vulnerabilities)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln costlake:ci

  e2e:
    name: end-to-end (docker compose)
    needs: [test, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file and Prometheus rules
        run: |
          ./scripts/init-env.sh
          docker compose config --quiet
          make promtool
      - name: Start the platform (build, Terraform bootstrap, health checks)
        run: make up
      - name: End-to-end test
        run: make e2e
      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/ps.txt
          for s in $(docker compose config --services); do docker compose logs --no-color "$s" > "diagnostics/$s.log" 2>&1 || true; done
          { echo "### Container status"; echo '```'; cat diagnostics/ps.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics
          path: diagnostics/
          retention-days: 14
      - name: Tear down
        if: always()
        run: make destroy
