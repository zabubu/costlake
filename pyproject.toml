[project]
name = "costlake"
version = "0.1.0"
description = "FinOps lakehouse: ingests FOCUS cloud billing exports into a medallion lake, checks data quality, allocates cost and detects spend anomalies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "zabubu" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Database",
]
dependencies = [
  "boto3>=1.35",
  "dbt-core>=1.10",
  "dbt-duckdb>=1.9.4",
  "duckdb>=1.1",
  "numpy>=1.26",
  "polars>=1.9",
  "prometheus-client>=0.21",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.30",
  "structlog>=24.4",
  "tenacity>=9.0",
  "typer>=0.12",
]

[project.optional-dependencies]
orchestration = [
  "dagster>=1.9",
  "dagster-dbt>=0.25",
  "dagster-postgres>=0.25",
  "dagster-webserver>=1.9",
]

[project.scripts]
costlake = "costlake.cli:app"

[dependency-groups]
dev = [
  "moto[s3]>=5.0",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
  "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costlake"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PTH", "PL", "TRY"]
ignore = [
  "PLR0913", # pipeline functions legitimately take many parameters
  "PLR0917", # same rationale, for positional parameters
  "PLR2004", # magic values are fine in tests and thresholds
  "TRY003",  # explicit error messages are clearer than custom exception subclasses per case
  "S608",    # SQL is built from validated identifiers, never from user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "PLC0415"]
# Heavy imports (dbt, Dagster, exporter) are deferred to the commands that need them.
"src/costlake/cli.py" = ["PLC0415"]
"src/costlake/transform/dbt.py" = ["PLC0415"]
"src/costlake/generator/**" = ["S311"] # pseudo-random data on purpose, seeded

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dagster.*", "dagster_dbt.*", "dbt.*", "moto.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["costlake.orchestration.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exercises several components together (local filesystem, SQLite, DuckDB, dbt)",
  "postgres: needs a reachable PostgreSQL (COSTLAKE_TEST_POSTGRES_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:dbt.*", "ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["costlake"]
omit = ["src/costlake/orchestration/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
