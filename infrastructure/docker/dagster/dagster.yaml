# Dagster instance: run, event and schedule storage in PostgreSQL; at most one
# pipeline run at a time (DuckDB has a single writer).
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

# Step output goes to container stdout, collected by Alloy into Loki.
compute_logs:
  module: dagster.core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

run_monitoring:
  enabled: true
  max_resume_run_attempts: 0
  poll_interval_seconds: 30

run_retries:
  enabled: true
  max_retries: 1

telemetry:
  enabled: false

nux:
  enabled: false
