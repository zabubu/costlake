apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Read-only role on the serving schema only.
  - name: costlake
    uid: costlake-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    jsonData:
      database: costlake
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
